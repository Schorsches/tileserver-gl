name: CT Alpine

# Container tests for the Alpine image: build, smoke test, full mocha suite
# inside the shipped image, and a CVE gate with an old-vs-new comparison.

# Invoked from pipeline.yml alongside ci.yml and ct.yml. It deliberately has no
# pull_request trigger of its own: that would run it a second time, outside
# pipeline.yml's concurrency group and missing from its status badge.
on:
  workflow_call:
  workflow_dispatch:

env:
  MAPLIBRE_REF: node-v6.4.1
  NODE_ABI: '137'
  ALPINE_VERSION: '3.22'
  REFERENCE_IMAGE: maptiler/tileserver-gl:latest

jobs:
  container-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.repository_owner keeps the account's original casing, but a
      # registry reference must be lowercase or buildx rejects it outright:
      # `invalid reference format: repository name must be lowercase`.
      - name: Resolve MBGL_IMAGE
        run: |
          echo "MBGL_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tileserver-gl-mbgl:${MAPLIBRE_REF}-abi${NODE_ABI}-alpine${ALPINE_VERSION}-egl" >> "$GITHUB_ENV"

      # The prebuilt addon is keyed on the Node ABI and the maplibre version.
      # If either drifts from package.json the image would silently ship a
      # mismatched binary, so fail here instead.
      - name: Assert prebuilt addon matches package.json
        run: |
          echo "MBGL_IMAGE=${MBGL_IMAGE}"
          want=$(node -p "require('./package.json').dependencies['@maplibre/maplibre-gl-native']" | tr -d '^~')
          [ "${MAPLIBRE_REF}" = "node-v${want}" ] || {
            echo "::error::MAPLIBRE_REF ${MAPLIBRE_REF} does not match package.json maplibre version ${want}"
            exit 1
          }
          echo "maplibre version ${want} matches MAPLIBRE_REF"

      # Without this the failure surfaces as a bare buildx
      # `<ref>: not found` against a Dockerfile line, which gives no hint that
      # the fix is a one-off run of another workflow.
      - name: Check the prebuilt addon exists
        run: |
          if docker buildx imagetools inspect "${MBGL_IMAGE}" >/dev/null 2>&1; then
            echo "found ${MBGL_IMAGE}"
          else
            echo "::error title=Missing mbgl prebuild::${MBGL_IMAGE} does not exist. Run the 'MBGL Alpine prebuild' workflow once (Actions -> MBGL Alpine prebuild -> Run workflow) to publish it, then re-run this job."
            exit 1
          fi

      - name: Build Alpine image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.alpine
          build-args: MBGL_IMAGE=${{ env.MBGL_IMAGE }}
          tags: tileserver-gl:alpine
          load: true
          push: false
          cache-from: type=gha,scope=alpine
          cache-to: type=gha,mode=max,scope=alpine

      - name: Smoke test startup and rendering
        run: |
          curl -fsSL -o test_data.zip \
            https://github.com/maptiler/tileserver-gl/releases/download/v1.3.0/test_data.zip
          unzip -q test_data.zip -d test_data
          docker run -d --name tsgl -p 8080:8080 -v "$PWD/test_data:/data" tileserver-gl:alpine
          for i in $(seq 1 60); do
            docker logs tsgl 2>&1 | grep -q "Startup complete" && break
            sleep 1
          done
          docker logs tsgl
          docker logs tsgl 2>&1 | grep -q "Startup complete" || { echo "::error::server never reported startup"; exit 1; }
          # "started" and "can actually render" are different claims -- check both.
          curl -fsS http://localhost:8080/health > /dev/null
          curl -fsS -o /tmp/tile.png http://localhost:8080/styles/test-style/static/0,0,0/256x256.png
          file /tmp/tile.png | grep -q 'PNG image' || { echo "::error::rendered tile is not a PNG"; exit 1; }
          docker rm -f tsgl

      - name: Run the full test suite inside the shipped image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile_test.alpine
          build-args: BASE=tileserver-gl:alpine
          load: false
          push: false

      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tileserver-gl:alpine
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

      - name: Compare CVEs and size against the Ubuntu image
        if: always()
        run: |
          docker pull "$REFERENCE_IMAGE"
          # This step is `if: always()`, so it also runs after an earlier
          # failure when the image may not exist. Trivy then prints nothing and
          # a bare json.load raises JSONDecodeError, replacing the real error
          # with a traceback. Degrade to "n/a" instead of masking the failure.
          scan() {
            out=$(docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
                    aquasec/trivy:latest image --quiet --severity HIGH,CRITICAL \
                    --ignore-unfixed --format json "$1" 2>/dev/null) || true
            [ -n "$out" ] || { echo 'n/a'; return; }
            printf '%s' "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(len(r.get('Vulnerabilities') or []) for r in (d.get('Results') or [])))" 2>/dev/null || echo 'n/a'
          }
          size() { docker image inspect "$1" --format '{{.Size}}' 2>/dev/null || echo 0; }
          old=$(scan "$REFERENCE_IMAGE"); new=$(scan tileserver-gl:alpine)
          oldsz=$(size "$REFERENCE_IMAGE"); newsz=$(size tileserver-gl:alpine)
          {
            echo '### Alpine image vs Ubuntu image'
            echo
            echo '| | Ubuntu (published) | Alpine (this build) |'
            echo '|---|---|---|'
            echo "| Fixable HIGH+CRITICAL | $old | $new |"
            echo "| Size | $(numfmt --to=iec $oldsz) | $(numfmt --to=iec $newsz) |"
            echo
            echo '_Note: ICU, sqlite and nunicode are vendored into `mbgl.node`, so they are invisible to Trivy. Part of the reduction is fewer packages, part is scanner blindness -- both are listed here deliberately._'
          } >> "$GITHUB_STEP_SUMMARY"
